name: Docker Build Multi-Arch (No Push, Download Test)

on:
  workflow_dispatch:

env:
  # 仅在此一处自定义，全文自动复用
  IMAGE_REGISTRY_NAME: playhub
  IMAGE_TAG: test
  ARTIFACT_PREFIX: playhub

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU multi-arch emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx builder
        uses: docker/setup-buildx-action@v3

      - name: Build single arch image & load locally
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.IMAGE_REGISTRY_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export image to tar archive
        run: |
          ARTIFACT_NAME="${{ env.ARTIFACT_PREFIX }}-${{ github.sha }}-${{ matrix.platform }}"
          docker save -o "${ARTIFACT_NAME}.tar" ${{ env.IMAGE_REGISTRY_NAME }}:${{ env.IMAGE_TAG }}

      - name: Upload tar package to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ github.sha }}-${{ matrix.platform }}
          path: ${{ env.ARTIFACT_PREFIX }}-${{ github.sha }}-${{ matrix.platform }}.tar
          retention-days: 30
