name: Docker Build Multi-Arch (No Push, Download Test)

on:
  workflow_dispatch:

env:
  # 只在这里一次性自定义，全文自动复用
  IMAGE_REGISTRY_NAME: hurryos/playhub
  IMAGE_TAG: local-build
  ARTIFACT_PREFIX: playhub-multiarch

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    env:
      FULL_IMAGE_TAG: ${{ env.IMAGE_REGISTRY_NAME }}:${{ env.IMAGE_TAG }}
      ARTIFACT_NAME: ${{ env.ARTIFACT_PREFIX }}-${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU multi-arch emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx builder
        uses: docker/setup-buildx-action@v3

      # 已删除Docker Hub登录步骤，不再推送镜像
      - name: Build multi-platform image & export tar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          tags: ${{ env.FULL_IMAGE_TAG }}
          outputs: type=docker,dest=${{ env.ARTIFACT_NAME }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload tar package to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar
          retention-days: 30
