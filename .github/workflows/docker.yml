name: Docker Build ARM64 Only (No Push, Download Test)

on:
  workflow_dispatch:

env:
  IMAGE_REGISTRY_NAME: playhub
  IMAGE_TAG: test
  ARTIFACT_PREFIX: playhub

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 拉到60分钟，彻底避免模拟构建超时
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU multi-arch emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx builder
        uses: docker/setup-buildx-action@v3

      - name: Build arm64 image & load locally
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          push: false
          load: true
          pull: true
          tags: ${{ env.IMAGE_REGISTRY_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image to tar archive
        run: |
          ARTIFACT_NAME="${{ env.ARTIFACT_PREFIX }}-${{ github.sha }}-linux_arm64"
          docker save -o "${ARTIFACT_NAME}.tar" ${{ env.IMAGE_REGISTRY_NAME }}:${{ env.IMAGE_TAG }}

      - name: Upload tar package to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ github.sha }}-linux_arm64
          path: ${{ env.ARTIFACT_PREFIX }}-${{ github.sha }}-linux_arm64.tar
          retention-days: 30
